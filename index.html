<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title">TETRIS</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="gameover-extra" class="hidden">
            <p id="new-record-msg">¡Nuevo récord! Escribe tu nombre</p>
            <form id="name-form" class="name-form" autocomplete="off">
              <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" />
              <button id="save-score-btn" type="submit">Guardar</button>
            </form>
            <ol id="overlay-scores" class="score-table"></ol>
          </div>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>

      <div id="start-screen" class="overlay">
        <div class="overlay-box">
          <p class="start-heading">MEJORES PUNTUACIONES</p>
          <ol id="start-scores" class="score-table"></ol>
          <p id="start-records" class="records-line"></p>
          <button id="play-btn">Jugar</button>
          <button id="reset-records-btn" class="link-btn">Resetear records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
